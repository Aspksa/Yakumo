name: Temporary brain checks

on:
  push:
    branches:
      - feature/brain-links-memory21-focus-20261025

jobs:
  focused:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run brain and cloud tests
        shell: pwsh
        run: python -m unittest tests.test_brain tests.test_cloud -v
