<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yakumo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Yakumo</h1>
  <p>Ядро запущено. Состояние:</p>
  <pre id="status">загрузка…</pre>
  <script>
    fetch("/api/status").then(r => r.json())
      .then(s => document.getElementById("status").textContent = JSON.stringify(s, null, 2))
      .catch(e => document.getElementById("status").textContent = "Ошибка: " + e);
  </script>
</body>
</html>
