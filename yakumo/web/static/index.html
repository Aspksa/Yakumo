<!doctype html>
<html lang="ru" data-accent="gold" data-radius="normal" data-cards="solid">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yakumo</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Значки -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
    <symbol id="i-files" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></symbol>
    <symbol id="i-modules" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M10 14l-7 7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z"/><path d="m11 13 9-9"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Yakumo, главная">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>Yakumo</span>
    </a>
    <nav class="topnav" aria-label="Главное меню" data-menu></nav>
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="dot"></span><span class="status-text">подключение…</span>
    </div>
  </header>

  <aside class="rail" aria-label="Боковая панель">
    <a class="icon-btn rail-settings" href="#/settings" data-route="settings" data-label="Настройки" aria-label="Настройки">
      <svg><use href="#i-settings"/></svg>
    </a>
  </aside>

  <main class="content" id="content" tabindex="-1"></main>

  <!-- Аватар: виден на всех страницах, перетаскивается, по нажатию открывает чат -->
  <button class="avatar" id="avatar" type="button" data-motion="float" data-glow="soft" data-speed="normal" aria-controls="chat" aria-expanded="false">
    <canvas class="fx fx-back" aria-hidden="true"></canvas>
    <!-- Вложенные обёртки двигаются с разными периодами: так движение не повторяется и выглядит живым -->
    <span class="av-fig"><span class="av-sway"><span class="av-pose">
      <!-- Картинку (образ из настроек) подставляет app.js -->
      <img class="av-img" alt="" width="2508" height="2508" draggable="false" decoding="async" sizes="196px">
      <img class="av-blink" alt="" draggable="false" hidden>
    </span></span></span>
    <canvas class="fx fx-front" aria-hidden="true"></canvas>
  </button>

  <section class="chat" id="chat" hidden>
    <header class="chat-head">
      <span class="chat-face"><img src="avatar-face.webp" alt="" width="44" height="44"><i class="chat-dot" id="chat-dot"></i></span>
      <div class="chat-title"><strong>Yakumo</strong><span class="chat-sub" id="chat-sub"></span></div>
      <button class="icon-btn" id="chat-max" type="button"><svg><use href="#i-max"/></svg></button>
      <button class="icon-btn" id="chat-clear" type="button"><svg><use href="#i-clear"/></svg></button>
      <button class="icon-btn" id="chat-close" type="button"><svg><use href="#i-close"/></svg></button>
    </header>
    <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
    <div class="chat-hints" id="chat-hints"></div>
    <form class="chat-form" id="chat-form">
      <div class="chat-field">
        <textarea id="chat-input" rows="1" maxlength="4000"></textarea>
        <button class="chat-send" type="submit"><svg><use href="#i-send"/></svg></button>
      </div>
      <div class="chat-foot"><span id="chat-keys"></span><span id="chat-count"></span></div>
    </form>
    <!-- Края и углы, за которые окно чата растягивается мышью -->
    <span class="grip" data-edge="n"></span><span class="grip" data-edge="s"></span>
    <span class="grip" data-edge="e"></span><span class="grip" data-edge="w"></span>
    <span class="grip" data-edge="ne"></span><span class="grip" data-edge="nw"></span>
    <span class="grip" data-edge="se"></span><span class="grip" data-edge="sw"></span>
  </section>

  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
